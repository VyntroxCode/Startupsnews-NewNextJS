services:
  # MariaDB Database
  mariadb:
    image: mariadb:10.11
    container_name: zox-mariadb
    restart: unless-stopped
    # Pin the packet limit: on 2026-09-14 a runtime SET GLOBAL had dropped it to 2 KB and every
    # hr_rules save failed with ER_NET_PACKET_TOO_LARGE. 64M covers large article bodies too.
    command: ["mariadbd", "--max-allowed-packet=64M"]
    environment:
      # Read from .env (gitignored). Hardcoded defaults used to live here: the root account kept the
      # literal password "rootpassword" while 3306 was published on 0.0.0.0, and on 2026-09-17 an
      # attacker logged in as root over the internet and dropped every table in zox_db (see agent.md
      # #848/#849). Root was rotated on 2026-09-18; these must never go back to guessable literals.
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: zox_db
      MYSQL_USER: zox_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Bound to loopback: nothing here should ever be reachable from the internet. Reach it from
      # another machine with an SSH tunnel (ssh -L 3306:127.0.0.1:3306 user@host), not by republishing.
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - zox-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: zox-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6382:6379"  # 6382 avoids a clash with other Redis instances; loopback only (no auth is set)
    volumes:
      - redis_data:/data
    networks:
      - zox-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer (Database Management UI) - Optional
  adminer:
    image: adminer:latest
    container_name: zox-adminer
    restart: unless-stopped
    ports:
      # Loopback only: a public Adminer is a second route into the database, firewalling 3306 alone
      # would not close it.
      - "127.0.0.1:8080:8080"
    networks:
      - zox-network
    depends_on:
      - mariadb

  # Redis Commander (Redis Management UI) - Optional
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: zox-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - zox-network
    depends_on:
      - redis

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  zox-network:
    driver: bridge

