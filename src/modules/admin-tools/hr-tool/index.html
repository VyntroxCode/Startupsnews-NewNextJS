<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huey — HR Management Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <div class="brand-name">Huey</div>
          <div class="brand-sub">HR Console</div>
        </div>
      </div>

      <div class="nav-group-label">Overview</div>
      <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◆</span> Dashboard</button>

      <div class="nav-group-label">People</div>
      <button class="nav-item" data-view="directory"><span class="nav-icon">☰</span> Employee Directory</button>
      <button class="nav-item" data-view="onboarding"><span class="nav-icon">→</span> Onboarding</button>
      <button class="nav-item" data-view="offboarding"><span class="nav-icon">←</span> Offboarding</button>

      <div class="nav-group-label">Time</div>
      <button class="nav-item" data-view="attendance"><span class="nav-icon">◷</span> Attendance</button>
      <button class="nav-item" data-view="leave"><span class="nav-icon">◇</span> Leave</button>

      <div class="nav-group-label">Money</div>
      <button class="nav-item" data-view="payroll"><span class="nav-icon">₹</span> Payroll</button>
      <button class="nav-item" data-view="expenses"><span class="nav-icon">◎</span> Expenses</button>

      <div class="nav-group-label">Compliance</div>
      <button class="nav-item" data-view="compliance"><span class="nav-icon">▤</span> Calendar &amp; Reminders</button>
      <button class="nav-item" data-view="posh"><span class="nav-icon">✨</span> POSH Committee</button>

      <div class="nav-group-label">Me</div>
      <button class="nav-item" data-view="documents"><span class="nav-icon">📄</span> My Documents</button>

      <div class="nav-group-label">Org</div>
      <button class="nav-item" data-view="helpdesk"><span class="nav-icon">◈</span> Helpdesk</button>
      <button class="nav-item" data-view="company"><span class="nav-icon">◆</span> Company Profile</button>
      <button class="nav-item" data-view="rules"><span class="nav-icon">⚙</span> Rules &amp; Org Structure</button>

      <div class="role-switch">
        <label>Logged in as</label>
        <div class="who" id="whoAmI">—</div>
        <button class="logout-btn" id="logoutBtn">⇄ Switch user / Log out</button>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="loginRoot"></div>

  <script src="script.js"></script>
</body>

</html>
